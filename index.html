<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK VIP SIGNAL & BOT ENGINE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SolaimanLipi:wght@400;700&family=Hind+Siliguri:wght@500;700;800&family=Montserrat:wght@600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Hind Siliguri', 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #090d16;
        }

        /* ব্যাকগ্রাউন্ড ফুল-স্ক্রিন রেফারেল Iframe */
        .bg-iframe {
            width: 100%;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ড্র্যাগ করার উপযোগী ফ্লোটিং আইকন */
        .floating-toggle-btn {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6d28d9, #ec4899);
            border: 2.5px solid #ffd700;
            box-shadow: 0 0 18px #ffd700, 0 0 30px #ff3366;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            touch-action: none;
            animation: pulseGlow 2s infinite alternate;
        }

        .floating-toggle-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 12px #ffd700, 0 0 22px #ff3366; }
            100% { transform: scale(1.06); box-shadow: 0 0 20px #00ff88, 0 0 35px #00ffff; }
        }

        /* পপআপ ওভারলে */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(9, 13, 22, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-y: auto;
        }

        /* মেইন প্রিমিয়াম গোল্ডেন গ্লোয়িং কার্ড */
        .popup-card {
            width: 100%;
            max-width: 390px;
            max-height: 94vh;
            background: linear-gradient(160deg, #121826 0%, #090d16 100%);
            border: 2px solid #ffd700;
            border-radius: 22px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.35), inset 0 0 15px rgba(255, 215, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        /* পপআপ হেডার */
        .popup-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid rgba(255, 215, 0, 0.3);
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 10px #ffd700;
            overflow: hidden;
        }

        .brand-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h3 {
            font-size: 13.5px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.8px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .brand-text span {
            font-size: 10.5px;
            color: #38bdf8;
            font-weight: 700;
        }

        .minimize-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* পপআপ বডি */
        .popup-body {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-label {
            font-size: 12px;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* মার্কেট সিলেকশন বাটন (30S / 1M) */
        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .market-btn {
            background: #1e293b;
            border: 1.5px solid #475569;
            border-radius: 8px;
            padding: 7px;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .market-btn.active-market {
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            border-color: #ffd700;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.5);
        }

        /* স্টিকার প্যানেল */
        .sticker-panel-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sticker-title {
            font-size: 11.5px;
            color: #ffd700;
            font-weight: 800;
        }

        .sticker-btns-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 3px;
        }

        .sticker-send-btn {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 7px;
            padding: 6px 10px;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .sticker-send-btn:active {
            transform: scale(0.9);
            background: #7c3aed;
        }

        /* পিরিয়ড ইনপুট ও লাইভ টাইমার রো */
        .period-row {
            display: flex;
            gap: 8px;
        }

        .input-box {
            flex: 1;
            background: #0f172a;
            border: 1.5px solid #475569;
            border-radius: 9px;
            padding: 8px 10px;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 700;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .input-box:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .timer-badge {
            background: #1e293b;
            border: 1.5px solid #475569;
            border-radius: 9px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #38bdf8;
            font-size: 13px;
            font-weight: 800;
        }

        /* অপশন বাটন গ্রিড (SMALL / BIG) */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .opt-btn {
            background: #1e293b;
            border: 1.5px solid #475569;
            border-radius: 9px;
            padding: 9px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .opt-btn.active-small {
            background: linear-gradient(135deg, #059669, #10b981);
            border-color: #34d399;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .opt-btn.active-big {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border-color: #f87171;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        /* লাইভ সিগন্যাল প্রিভিউ বক্স */
        .preview-box {
            background: #090d16;
            border: 1.5px dashed #ffd700;
            border-radius: 12px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #e2e8f0;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
            -webkit-user-select: text;
        }

        /* সেন্ড বাটন */
        .send-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4);
            letter-spacing: 0.5px;
            transition: transform 0.15s ease;
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .status-alert {
            display: none;
            text-align: center;
            font-size: 11.5px;
            font-weight: 700;
            padding: 7px;
            border-radius: 7px;
        }

        .popup-footer {
            background: #070a12;
            padding: 7px;
            text-align: center;
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            border-top: 1px solid #1e293b;
        }

        .popup-footer span {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড রেফারেল সাইট -->
    <iframe class="bg-iframe" src="https://hgnice0.com/#/register?invitationCode=376851951983"></iframe>

    <!-- ড্র্যাগ করার উপযোগী ফ্লোটিং আইকন -->
    <div class="floating-toggle-btn" id="floating-btn">
        <img src="https://cdn.imageurlgenerator.com/uploads/c1a51603-836b-4307-abe9-140f47b94444.jpg" alt="Open Panel">
    </div>

    <!-- মেইন পপআপ ওভারলে -->
    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-card">
            
            <!-- হেডার -->
            <div class="popup-header">
                <div class="brand-info">
                    <div class="brand-avatar">
                        <img src="https://cdn.imageurlgenerator.com/uploads/c1a51603-836b-4307-abe9-140f47b94444.jpg" alt="Logo">

            <!-- বডি -->
            <div class="popup-body">
                
                <!-- মার্কেট সিলেকশন (30S / 1M) -->
                <div class="control-group">
                    <div class="control-label">
                        <span>📊 MARKET SELECT:</span>
                    </div>
                    <div class="market-grid">
                        <button type="button" id="market-30s" class="market-btn active-market" onclick="setMarket('30S')">WinGo 30S</button>

                <!-- স্টিকার প্যানেল -->
                <div class="sticker-panel-box">
                    <div class="sticker-title">

                    </div>
                    <div class="sticker-btns-row">
                        <button type="button" class="sticker-send-btn" onclick="sendStickerEmoji('🔥')">🔥 Patowari</button>
                        <button type="button" class="sticker-send-btn" onclick="sendStickerEmoji('💎')">💎 VIP</button>
                        <button type="button" class="sticker-send-btn" onclick="sendStickerEmoji('🚀')">🚀 Rocket</button>
                        <button type="button" class="sticker-send-btn" onclick="sendStickerEmoji('👑')">👑 King</button>
                        <button type="button" class="sticker-send-btn" onclick="sendStickerEmoji('🎯')">🎯 Target</button>
                    </div>
                </div>

                <!-- পিরিয়ড ইনপুট ও লাইভ টাইমার -->
                <div class="control-group">
                    <div class="control-label">
                        <span>🎯 PERIOD (Live Sync):</span>
                    </div>

                <div class="control-group">

                        <span>⚡ ACTION (SMALL / BIG):</span>
                    </div>
                    <div class="options-grid">
                        <button type="button" id="btn-small" class="opt-btn active-small" onclick="setAction('SMALL')">SMALL</button>
                        <button type="button" id="btn-big" class="opt-btn" onclick="setAction('BIG')">BIG</button>
                    </div>
                </div>

                <!-- সিগন্যাল প্রিভিউ বক্স -->
                <div class="control-group">
                    <div class="control-label">
                        <span>📋 চ্যানেলে সেন্ড হওয়ার প্রিভিউ:</span>
                    </div>
                    <div id="signal-preview" class="preview-box"></div>
                </div>

                <!-- অটো সেন্ড বাটন -->
                <button class="send-btn" onclick="sendAutoSignal()">চ্যানেলে অটো সেন্ড করুন 🚀</button>

                <!-- স্ট্যাটাস মেসেজ -->
                <div id="status-alert" class="status-alert"></div>
            </div>

            <!-- ফুটার -->
            <div class="popup-footer">
                Powered by <span>SIDDIK VIP SIGNAL</span> | @Bdt5847
            </div>
        </div>
    </div>

    <script>
        let currentAction = 'SMALL';
        let currentMarket = '30S'; // ডিফল্ট ৩০ সেকেন্ড মার্কেট
        const chatId = "-1004478174913"; // তোর প্রাইভেট চ্যানেল আইডি[span_1](start_span)[span_1](end_span)
        const botToken = "9043785152:AAG37P5ZVgjVUw7l80RiJl2tUzl4MQokP1o";

        // লাইভ পিরিয়ড ও কাউন্টডাউন টাইমার ইঞ্জিন (WinGo 30S & 1M Sync)
        function startLiveTimer() {
            setInterval(() => {
                const now = new Date();
                const totalSeconds = Math.floor(now.getTime() / 1000);
                
                let periodVal, secondsLeft, marketDuration;

                if (currentMarket === '30S') {
                    marketDuration = 30;
                    secondsLeft = 30 - (totalSeconds % 30);
                    periodVal = Math.floor(totalSeconds / 30) + 50000;
                } else {
                    marketDuration = 60;
                    secondsLeft = 60 - (totalSeconds % 60);
                    periodVal = Math.floor(totalSeconds / 60) + 80000;
                }

                // যদি ইনপুট বক্স ফোকাস করা না থাকে, তবে অটো লাইভ পিরিয়ড আপডেট হবে
                const periodInput = document.getElementById('period-input');
                if (document.activeElement !== periodInput) {
                    periodInput.value = periodVal;
                    updatePreview();
                }

                // টাইমার ব্যাজ আপডেট
                document.getElementById('timer-display').innerText = secondsLeft + 's';
            }, 1000);
        }

        // মার্কেট পরিবর্তন করার ফাংশন (30S / 1M)
        function setMarket(market) {
            currentMarket = market;
            const btn30s = document.getElementById('market-30s');
            const btn1m = document.getElementById('market-1m');

            if (market === '30S') {
                btn30s.className = 'market-btn active-market';
                btn1m.className = 'market-btn';
            } else {
                btn30s.className = 'market-btn';
                btn1m.className = 'market-btn active-market';
            }
            updatePreview();
        }

        // ফ্লোটিং আইকন ড্র্যাগিং (Move) লজিক
        const floatBtn = document.getElementById('floating-btn');
        let isDragging = false;
        let startX, startY, initialX, initialY;

        floatBtn.addEventListener('pointerdown', (e) => {
            isDragging = false;
            startX = e.clientX;
            startY = e.clientY;
            initialX = floatBtn.offsetLeft;
            initialY = floatBtn.offsetTop;
            floatBtn.setPointerCapture(e.pointerId);
        });

        floatBtn.addEventListener('pointermove', (e) => {
            if (e.buttons === 0) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                isDragging = true;
            }
            if (isDragging) {
                floatBtn.style.left = (initialX + dx) + 'px';
                floatBtn.style.top = (initialY + dy) + 'px';
                floatBtn.style.bottom = 'auto';
                floatBtn.style.right = 'auto';
            }
        });

        floatBtn.addEventListener('click', (e) => {
            if (!isDragging) {
                togglePopup(true);
            }
        });

        function togglePopup(show) {
            const overlay = document.getElementById('popup-overlay');
            if (show) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        function setAction(action) {
            currentAction = action;
            const btnSmall = document.getElementById('btn-small');
            const btnBig = document.getElementById('btn-big');

            if (action === 'SMALL') {
                btnSmall.className = 'opt-btn active-small';
                btnBig.className = 'opt-btn';
            } else {
                btnSmall.className = 'opt-btn';
                btnBig.className = 'opt-btn active-big';
            }
            updatePreview();
        }

        // সিগন্যাল টেক্সট জেনারেট করা (মার켓 টাইপসহ)
        function getFormattedMessage() {
            const period = document.getElementById('period-input').value || '50360';
            const referralLink = "https://hgnice0.com/#/register?invitationCode=376851951983";
            const wingoTime = currentMarket === '30S' ? '𝟯𝟬𝗦' : '𝟲𝟬𝗦';

            return `🔥 𝗦𝗠𝗔𝗟𝗟 𝗦𝗜𝗚𝗡𝗔𝗟 🔥\n▱▱▱▱▱▱▱▱▱▱▱▱▱▱\n💎 𝐏𝐄𝐑𝐈𝐎𝐃 ➤ 📅 ${period}\n🎯 𝐀𝐂𝐓𝐈𝐎𝐍 ➤ 𝐁𝐄𝐓 ${currentAction}\n⚡ 𝐖𝐈𝐍𝐆𝐎 ➤ ${wingoTime} ⏱️\n▱▱▱▱▱▱▱▱▱▱▱▱▱▱\n🔗 [𝗗𝗜𝗥𝗘𝗖𝗧 𝗪𝗘𝗕 𝗘𝗡𝗧𝗥𝗬](${referralLink})`;
        }

        function updatePreview() {
            document.getElementById('signal-preview').innerText = getFormattedMessage();
        }

        window.onload = function() {
            updatePreview();
            startLiveTimer(); // লাইভ টাইমার চালু হলো
        };

        function sendStickerEmoji(emojiSymbol) {
            const stickerText = `${emojiSymbol} Patowari Short Signal Badge ${emojiSymbol}`;
            const apiUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

            showStatus("⏳ স্টিকার সিগন্যাল পাঠানো হচ্ছে...", "#38bdf8", "rgba(56, 189, 248, 0.12)");

            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: stickerText
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    showStatus("✅ স্টিকার সফলভাবে সেন্ড হয়েছে!", "#22c55e", "rgba(34, 197, 94, 0.12)");
                } else {
                    showStatus("❌ এরর: " + (data.description || "বট অ্যাডমিন আছে তো?"), "#f87171", "rgba(248, 113, 113, 0.12)");
                }
            })
            .catch(() => {
                showStatus("❌ নেটওয়ার্ক সমস্যা!", "#f87171", "rgba(248, 113, 113, 0.12)");
            });
        }

        function sendAutoSignal() {
            const message = getFormattedMessage();
            const apiUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

            showStatus("⏳ চ্যানেলে সিগন্যাল পাঠানো হচ্ছে...", "#38bdf8", "rgba(56, 189, 248, 0.12)");

            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'Markdown'
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    showStatus("✅ চ্যানেলে সফলভাবে সেন্ড হয়েছে!", "#22c55e", "rgba(34, 197, 94, 0.12)");
                } else {
                    showStatus("❌ এরর: " + (data.description || "বট অ্যাডমিন আছে তো?"), "#f87171", "rgba(248, 113, 113, 0.12)");
                }
            })
            .catch(() => {
                showStatus("❌ নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।", "#f87171", "rgba(248, 113, 113, 0.12)");
            });
        }

        function showStatus(text, color, bg) {
            const box = document.getElementById('status-alert');
            box.style.display = "block";
            box.style.color = color;
            box.style.background = bg;
            box.innerText = text;
        }
    </script>
</body>
</html>
