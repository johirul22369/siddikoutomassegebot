<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK VIP SIGNAL & BOT ENGINE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SolaimanLipi:wght@400;700&family=Hind+Siliguri:wght@500;700;800&family=Montserrat:wght@600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Hind Siliguri', 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #090d16;
        }

        /* ব্যাকগ্রাউন্ড ফুল-স্ক্রিন রেফারেল Iframe */
        .bg-iframe {
            width: 100%;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ফ্লোটিং হ্যাক আইকন (মিনিমাইজ করলে ভাসতে থাকবে) */
        .floating-toggle-btn {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6d28d9, #ec4899);
            border: 2.5px solid #ffd700;
            box-shadow: 0 0 18px #ffd700, 0 0 30px #ff3366;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            animation: pulseGlow 2s infinite alternate;
        }

        .floating-toggle-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 12px #ffd700, 0 0 22px #ff3366; }
            100% { transform: scale(1.06); box-shadow: 0 0 20px #00ff88, 0 0 35px #00ffff; }
        }

        /* ডার্ক ব্লার পপআপ ওভারলে */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(9, 13, 22, 0.72);
            backdrop-filter: blur(7px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        /* মেইন পপআপ কার্ড */
        .popup-card {
            width: 100%;
            max-width: 390px;
            background: linear-gradient(160deg, #1e1b4b 0%, #0f172a 100%);
            border: 1.5px solid rgba(255, 215, 0, 0.45);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(139, 92, 246, 0.35);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        /* পপআপ হেডার */
        .popup-header {
            background: linear-gradient(135deg, #4c1d95 0%, #311060 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid rgba(255, 215, 0, 0.3);
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 10px #ffd700;
            overflow: hidden;
        }

        .brand-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h3 {
            font-size: 14.5px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.7);
        }

        .brand-text span {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 700;
        }

        .minimize-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* পপআপ বডি */
        .popup-body {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-label {
            font-size: 12.5px;
            font-weight: 700;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* কুইক ইমোজি বার */
        .emoji-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: rgba(15, 23, 42, 0.75);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #334155;
            justify-content: center;
        }

        .emoji-btn {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 7px;
            padding: 4px 8px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .emoji-btn:active {
            transform: scale(0.9);
            background: #4c1d95;
        }

        /* সিগন্যাল টেক্সট ও ইনপুট বক্স */
        .input-field {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1.5px solid #475569;
            background: #0f172a;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 700;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .input-field:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2.5px rgba(139, 92, 246, 0.25);
        }

        textarea.input-field {
            resize: none;
            line-height: 1.45;
        }

        /* অ্যাকশন বাটন */
        .send-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #ffffff;
            font-size: 14.5px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(34, 197, 94, 0.4);
            letter-spacing: 0.5px;
            transition: transform 0.15s ease;
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .status-alert {
            display: none;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            padding: 8px;
            border-radius: 8px;
        }

        .popup-footer {
            background: #0b101d;
            padding: 8px;
            text-align: center;
            font-size: 10.5px;
            color: #64748b;
            font-weight: 700;
            border-top: 1px solid #1e293b;
        }

        .popup-footer span {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড রেফারেল সাইট -->
    <iframe class="bg-iframe" src="https://hgnice0.com/#/register?invitationCode=376851951983"></iframe>

    <!-- মিনিমাইজ করলে ফ্লোটিং আইকন -->
    <div class="floating-toggle-btn" id="floating-btn" onclick="togglePopup(true)">
        <img src="https://cdn.imageurlgenerator.com/uploads/c1a51603-836b-4307-abe9-140f47b94444.jpg" alt="Open Signal Panel">
    </div>

    <!-- মেইন সিগন্যাল ও অটো-বট পপআপ -->
    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-card">
            
            <!-- হেডার -->
            <div class="popup-header">
                <div class="brand-info">
                    <div class="brand-avatar">
                        <img src="https://cdn.imageurlgenerator.com/uploads/c1a51603-836b-4307-abe9-140f47b94444.jpg" alt="Logo">
                    </div>
                    <div class="brand-text">
                        <h3>⚡ SIDDIK VIP SIGNAL ⚡</h3>
                        <span>🤖 @SdkSignalBot Active</span>
                    </div>
                </div>
                <button class="minimize-btn" onclick="togglePopup(false)" title="মিনিমাইজ করুন">✕</button>
            </div>

            <!-- বডি -->
            <div class="popup-body">
                <div class="section-label">
                    <span>🎯 কুইক ইমোজি সিলেক্ট করুন:</span>
                </div>

                <!-- ক্লিকেবল ইমোজি বাটনসমূহ -->
                <div class="emoji-bar">
                    <button type="button" class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('⚡')">⚡</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('🎯')">🎯</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('🚀')">🚀</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('💰')">💰</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('🟢')">🟢</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('🔴')">🔴</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('👑')">👑</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('✅')">✅</button>
                    <button type="button" class="emoji-btn" onclick="insertEmoji('💎')">💎</button>
                </div>

                <!-- সিগন্যাল মেসেজ বক্স -->
                <textarea id="signal-message" class="input-field" rows="4" placeholder="চ্যানেলে পাঠানোর সিগন্যাল লিখুন...">🔥 HGNICE VIP SIGNAL 🔥
🎯 Period: 30 Sec WinGo
💰 Result: BIG 🟢
⚡ Step: 1 (Follow Money Management)</textarea>

                <!-- চ্যানেল ইউজারনেম / আইডি -->
                <input type="text" id="channel-id" class="input-field" placeholder="চ্যানেল ইউজারনেম (যেমন: @your_channel)" value="@">

                <!-- অটো সেন্ড বাটন -->
                <button class="send-btn" onclick="sendAutoSignal()">চ্যানেলে অটো সেন্ড করুন 🚀</button>

                <!-- স্ট্যাটাস মেসেজ -->
                <div id="status-alert" class="status-alert"></div>
            </div>

            <!-- ফুটার -->
            <div class="popup-footer">
                Powered by <span>SIDDIK VIP SYSTEM</span> | @Bdt5847
            </div>
        </div>
    </div>

    <script>
        // পপআপ ওপেন / মিনিমাইজ ফাংশন
        function togglePopup(show) {
            const overlay = document.getElementById('popup-overlay');
            const floatBtn = document.getElementById('floating-btn');
            if (show) {
                overlay.style.display = 'flex';
                floatBtn.style.display = 'none';
            } else {
                overlay.style.display = 'none';
                floatBtn.style.display = 'flex';
            }
        }

        // টেক্সট বক্সে ইমোজি যোগ করার ফাংশন
        function insertEmoji(emoji) {
            const textarea = document.getElementById('signal-message');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, start) + emoji + text.substring(end);
            textarea.selectionStart = textarea.selectionEnd = start + emoji.length;
            textarea.focus();
        }

        // টেলিগ্রাম চ্যানেলে অটো সিগন্যাল সেন্ড করার ফাংশন
        function sendAutoSignal() {
            const message = document.getElementById('signal-message').value.trim();
            const chatId = document.getElementById('channel-id').value.trim();
            const statusAlert = document.getElementById('status-alert');

            if (!message) {
                showStatus("⚠️ দয়া করে সিগন্যাল টেক্সট লিখুন!", "#f87171", "rgba(248, 113, 113, 0.12)");
                return;
            }

            if (!chatId || chatId === "@") {
                showStatus("⚠️ আপনার চ্যানেলের ইউজারনেম দিন!", "#f87171", "rgba(248, 113, 113, 0.12)");
                return;
            }

            // তোমার সেট করা বটের টোকেন
            const botToken = "9043785152:AAG37P5ZVgjVUw7l80RiJl2tUzl4MQokP1o";
            const apiUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;

            showStatus("⏳ চ্যানেলে সিগন্যাল পাঠানো হচ্ছে...", "#38bdf8", "rgba(56, 189, 248, 0.12)");

            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    showStatus("✅ চ্যানেলে সফলভাবে সেন্ড হয়েছে!", "#22c55e", "rgba(34, 197, 94, 0.12)");
                } else {
                    showStatus("❌ এরর: " + (data.description || "চ্যানেলে বট অ্যাডমিন আছে তো?"), "#f87171", "rgba(248, 113, 113, 0.12)");
                }
            })
            .catch(() => {
                showStatus("❌ নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।", "#f87171", "rgba(248, 113, 113, 0.12)");
            });
        }

        function showStatus(text, color, bg) {
            const box = document.getElementById('status-alert');
            box.style.display = "block";
            box.style.color = color;
            box.style.background = bg;
            box.innerText = text;
        }
    </script>
</body>
</html>
