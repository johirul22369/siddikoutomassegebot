<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIDDIK VIP SIGNAL & BOT ENGINE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SolaimanLipi:wght@400;700&family=Hind+Siliguri:wght@500;700;800&family=Montserrat:wght@600;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Hind Siliguri', 'Montserrat', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #090d16;
        }

        /* ব্যাকগ্রাউন্ড ফুল-স্ক্রিন রেফারেল Iframe */
        .bg-iframe {
            width: 100%;
            height: 100vh;
            border: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ফ্লোটিং হ্যাক আইকন */
        .floating-toggle-btn {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6d28d9, #ec4899);
            border: 2.5px solid #ffd700;
            box-shadow: 0 0 18px #ffd700, 0 0 30px #ff3366;
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            animation: pulseGlow 2s infinite alternate;
        }

        .floating-toggle-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 12px #ffd700, 0 0 22px #ff3366; }
            100% { transform: scale(1.06); box-shadow: 0 0 20px #00ff88, 0 0 35px #00ffff; }
        }

        /* পপআপ ওভারলে */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(9, 13, 22, 0.45);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow-y: auto;
            pointer-events: none;
        }

        /* মেইন প্রিমিয়াম গোল্ডেন গ্লোয়িং কার্ড */
        .popup-card {
            width: 100%;
            max-width: 390px;
            max-height: 94vh;
            background: linear-gradient(160deg, #121826 0%, #090d16 100%);
            border: 2px solid #ffd700;
            border-radius: 22px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.35), inset 0 0 15px rgba(255, 215, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            animation: popIn 0.3s ease-out;
            pointer-events: auto;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        /* পপআপ হেডার */
        .popup-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid rgba(255, 215, 0, 0.3);
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 10px #ffd700;
            overflow: hidden;
        }

        .brand-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h3 {
            font-size: 13.5px;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.8px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .brand-text span {
            font-size: 10.5px;
            color: #38bdf8;
            font-weight: 700;
        }

        .minimize-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* পপআপ বডি */
        .popup-body {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-label {
            font-size: 12px;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* স্টিকার প্যাক শর্টকাট বার */
        .sticker-pack-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 9px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sticker-info {
            font-size: 11.5px;
            color: #38bdf8;
            font-weight: 700;
        }

        .sticker-link-btn {
            background: #4c1d95;
            color: #fff;
            border: 1px solid #8b5cf6;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        /* পিরিয়ড ইনপুট ও টাইমার রো */
        .period-row {
            display: flex;
            gap: 8px;
        }

        .input-box {
            flex: 1;
            background: #0f172a;
            border: 1.5px solid #475569;
            border-radius: 9px;
            padding: 8px 10px;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 700;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }

        .input-box:focus {
            border-color: #ffd700;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .timer-badge {
            background: #1e293b;
            border: 1.5px solid #475569;
            border-radius: 9px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #38bdf8;
            font-size: 13px;
            font-weight: 800;
        }

        /* অপশন বাটন গ্রিড */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .opt-btn {
            background: #1e293b;
            border: 1.5px solid #475569;
            border-radius: 9px;
            padding: 9px;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .opt-btn.active-small {
            background: linear-gradient(135deg, #059669, #10b981);
            border-color: #34d399;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .opt-btn.active-big {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border-color: #f87171;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        /* লাইভ সিগন্যাল প্রিভিউ বক্স */
        .preview-box {
            background: #090d16;
            border: 1.5px dashed #ffd700;
            border-radius: 12px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #e2e8f0;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
            -webkit-user-select: text;
        }

        /* সেন্ড বাটন */
        .send-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4);
            letter-spacing: 0.5px;
            transition: transform 0.15s ease;
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .status-alert {
            display: none;
            text-align: center;
            font-size: 11.5px;
            font-weight: 700;
            padding: 7px;
            border-radius: 7px;
        }

        .popup-footer {
            background: #070a12;
            padding: 7px;
            text-align: center;
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            border-top: 1px solid #1e293b;
        }

        .popup-footer span {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- ব্যাকগ্রাউন্ড রেফারেল সাইট -->
    <iframe class="bg-iframe" src="https://hgnice0.com/#/register?invitationCode=376851951983"></iframe>

    <!-- মিনিমাইজ করলে ফ্লোটিং আইকন -->
    <div class="floating-toggle-btn" id="floating-btn" onclick="togglePopup(true)">
        <img src="https://cdn.imageurlgenerator.com/uploads/c1a51603-836b-4307-abe9-140f47b94444.jpg" alt="Open Panel">
    </div>

    <!-- মেইন পপআপ ওভারলে -->
    <div class="popup-overlay" id="popup-overlay">
        <div class="popup-card">
            
            <!-- হেডার -->
            <div class="popup-header">
                <div class="brand-info">
                    <div class="brand-avatar">
                        <img src="https://cdn.imageurlgenerator.com/uploads/c1a51603-836b-4307-abe9-140f47b94444.jpg" alt="Logo">
                    </div>
                    <div class="brand-text">
                        <h3>👑 SIDDIK VIP SYSTEM 👑</h3>
                        <span>Manual Signal & Bot Engine (30S)</span>
                    </div>
                </div>
                <button class="minimize-btn" onclick="togglePopup(false)">✕</button>
            </div>

            <!-- বডি -->
            <div class="popup-body">
                
                <!-- স্টিকার প্যাক শর্টকাট প্যানেল -->
                <div class="sticker-pack-box">
                    <span class="sticker-info">🎁 Patowari Short Pack</span>
                    <a href="https://t.me/addstickers/PatowariShort" target="_blank" class="sticker-link-btn">প্যাক অ্যাড করুন</a>
                </div>

                <!-- পিরিয়ড ইনপুট -->
                <div class="control-group">
                    <div class="control-label">
                        <span>🎯 PERIOD:</span>
                    </div>
                    <div class="period-row">
                        <input type="number" id="period-input" class="input-box" value="50360" oninput="updatePreview()">
                        <div class="timer-badge">⏳ <span id="timer-display">30s</span></div>
                    </div>
                </div>

                <!-- অ্যাকশন সিলেকশন (SMALL / BIG) -->
                <div class="control-group">
                    <div class="control-label">
                        <span>⚡ ACTION (SMALL / BIG):</span>
                    </div>
                    <div class="options-grid">
                        <button type="button" id="btn-small" class="opt-btn active-small" onclick="setAction('SMALL')">SMALL</button>
                        <button type="button" id="btn-big" class="opt-btn" onclick="setAction('BIG')">BIG</button>
                    </div>
                </div>

                <!-- সিগন্যাল প্রিভিউ বক্স -->
                <div class="control-group">
                    <div class="control-label">
                        <span>📋 চ্যানেলে সেন্ড হওয়ার প্রিভিউ:</span>
                    </div>
                    <div id="signal-preview" class="preview-box"></div>
                </div>

                <!-- অটো সেন্ড বাটন -->
                <button class="send-btn" onclick="sendAutoSignal()">চ্যানেলে অটো সেন্ড করুন 🚀</button>

                <!-- স্ট্যাটাস মেসেজ -->
                <div id="status-alert" class="status-alert"></div>
            </div>

            <!-- ফুটার -->
            <div class="popup-footer">
                Powered by <span>SIDDIK VIP SIGNAL</span> | @Bdt5847
            </div>
        </div>
    </div>

    <script>
        let currentAction = 'SMALL';

        // পপআপ ওপেন / মিনিমাইজ
        function togglePopup(show) {
            const overlay = document.getElementById('popup-overlay');
            const floatBtn = document.getElementById('floating-btn');
            if (show) {
                overlay.style.display = 'flex';
                floatBtn.style.display = 'none';
            } else {
                overlay.style.display = 'none';
                floatBtn.style.display = 'flex';
            }
        }

        // অ্যাকশন সেট করা (SMALL বা BIG)
        function setAction(action) {
            currentAction = action;
            const btnSmall = document.getElementById('btn-small');
            const btnBig = document.getElementById('btn-big');

            if (action === 'SMALL') {
                btnSmall.className = 'opt-btn active-small';
                btnBig.className = 'opt-btn';
            } else {
                btnSmall.className = 'opt-btn';
                btnBig.className = 'opt-btn active-big';
            }
            updatePreview();
        }

        // সিগন্যাল টেক্সট জেনারেট করা (লিংক হাইড করা ফরম্যাট সহ)
        function getFormattedMessage() {
            const period = document.getElementById('period-input').value || '50360';
            const referralLink = "https://hgnice0.com/#/register?invitationCode=376851951983";

            // টেলিগ্রাম MarkdownV2 বা HTML লিংক হাইড ফরম্যাট: [DIRECT WEB ENTRY](url)
            // এতে চ্যানেলে শুধু 'DIRECT WEB ENTRY' লেখাই দেখাবে, কিন্তু ক্লিক করলে লিংকে চলে যাবে।
            return `🔥 𝗦𝗠𝗔𝗟𝗟 𝗦𝗜𝗚𝗡𝗔𝗟 🔥\n▱▱▱▱▱▱▱▱▱▱▱▱▱▱\n💎 𝐏𝐄𝐑𝐈𝐎𝐃 ➤ 📅 ${period}\n🎯 𝐀𝐂𝐓𝐈𝐎𝐍 ➤ 𝐁𝐄𝐓 ${currentAction}\n⚡ 𝐖𝐈𝐍𝐆𝐎 ➤ 𝟯𝟬𝗦 ⏱️\n▱▱▱▱▱▱▱▱▱▱▱▱▱▱\n🔗 [𝗗𝗜𝗥𝗘𝗖𝗧 𝗪𝗘𝗕 𝗘𝗡𝗧𝗥𝗬](${referralLink})`;
        }

        // প্রিভিউ আপডেট করা
        function updatePreview() {
            document.getElementById('signal-preview').innerText = getFormattedMessage();
        }

        // পেজ লোড হওয়ার সাথে সাথে প্রিভিউ দেখাবে
        window.onload = function() {
            updatePreview();
        };

        // টেলিগ্রাম চ্যানেলে অটো সিগন্যাল সেন্ড করার ফাংশন (Markdown মোড সহ)
        function sendAutoSignal() {
            const message = getFormattedMessage();
            const chatId = "-1004478174913"; // প্রাইভেট চ্যানেল আইডি[span_0](start_span)[span_0](end_span)
            const botToken = "9043785152:AAG37P5ZVgjVUw7l80RiJl2tUzl4MQokP1o";
            const apiUrl = `https://api.telegram.org/bot${botToken}/sendMessage`;
            const statusAlert = document.getElementById('status-alert');

            showStatus("⏳ চ্যানেলে সিগন্যাল পাঠানো হচ্ছে...", "#38bdf8", "rgba(56, 189, 248, 0.12)");

            fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: 'Markdown' // লিংক হাইড ও সুন্দর ফরম্যাটের জন্য
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    showStatus("✅ চ্যানেলে সফলভাবে সেন্ড হয়েছে!", "#22c55e", "rgba(34, 197, 94, 0.12)");
                } else {
                    showStatus("❌ এরর: " + (data.description || "বট অ্যাডমিন আছে তো?"), "#f87171", "rgba(248, 113, 113, 0.12)");
                }
            })
            .catch(() => {
                showStatus("❌ নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।", "#f87171", "rgba(248, 113, 113, 0.12)");
            });
        }

        function showStatus(text, color, bg) {
            const box = document.getElementById('status-alert');
            box.style.display = "block";
            box.style.color = color;
            box.style.background = bg;
            box.innerText = text;
        }
    </script>
</body>
</html>
